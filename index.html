<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Examen Militar / EMM</title>

<style>
body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #e8edf3, #dbe3ec);
    margin:0;
}

header{
    background:#1b2a3a;
    color:white;
    padding:18px;
    text-align:center;
    font-size:20px;
    letter-spacing:1px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.container{
    width:90%;
    max-width:900px;
    margin:25px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

textarea, input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    margin:8px 0;
    background:#1b2a3a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    background:#2c3e50;
    transform:scale(1.02);
}

.option{
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}

.option:hover{
    background:#f2f6fa;
}

.selected{
    background:#1b2a3a;
    color:white;
    border-color:#1b2a3a;
}

.hidden{ display:none; }

#timer{
    float:right;
    font-weight:bold;
}

#question{
    font-size:22px;
    margin-bottom:20px;
    font-weight:500;
}

/* 🟩 BARRA */
#timeBarContainer{
    position:fixed;
    bottom:25px;
    left:0;
    width:100%;
    height:12px;
    background:#d0d7de;
    z-index:9999;
}

#timeBar{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#1b2a3a,#4a6c8c);
    transition: width 1s linear;
}

/* ⏱️ TIEMPO TOTAL */
#totalTimeFixed{
    position:fixed;
    bottom:40px;
    left:0;
    width:100%;
    text-align:center;
    font-weight:bold;
    color:#1b2a3a;
    background:white;
    padding:6px 0;
    box-shadow:0 -2px 5px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<header>
Examen Militar / EMM
<span id="timer"></span>
</header>

<div class="container" id="setup">

<h2>Configuración del examen</h2>

<input id="totalInput" type="number" placeholder="Tiempo total (minutos)">
<input id="perInput" type="number" placeholder="Tiempo por pregunta (segundos)">
<textarea id="txt"></textarea>

<button onclick="cargar()">Iniciar examen</button>

</div>

<div class="container hidden" id="exam">

<div id="info"></div>
<div id="question"></div>
<div id="options"></div>

<button onclick="next()">Siguiente</button>

</div>

<div class="container hidden" id="result">

<h2>Resultados finales</h2>
<p id="final"></p>

</div>

<!-- 🟩 BARRA -->
<div id="timeBarContainer">
    <div id="timeBar"></div>
</div>

<!-- ⏱️ TIEMPO TOTAL -->
<div id="totalTimeFixed"></div>

<script>

const setup = document.getElementById("setup");
const exam = document.getElementById("exam");
const result = document.getElementById("result");

const info = document.getElementById("info");
const question = document.getElementById("question");
const options = document.getElementById("options");
const timer = document.getElementById("timer");
const final = document.getElementById("final");

let questions = [];
let answers = [];
let i = 0;
let selected = "";

let totalTime;
let perTime;

let totalInterval;
let perInterval;

let timeUsed = 0;
let totalInitial = 0;

function cargar(){

    questions = [];
    answers = [];
    i = 0;
    selected = "";
    timeUsed = 0;

    totalTime = (parseInt(document.getElementById("totalInput").value) || 1) * 60;
    perTime = parseInt(document.getElementById("perInput").value) || 10;

    totalInitial = totalTime;

    let text = document.getElementById("txt").value;

    let blocks = text.split("PREGUNTA:");

    blocks.forEach(b=>{
        if(b.includes("A)") && b.includes("RESPUESTA:")){

            let q = b.split("A)")[0].trim();
            let a = b.split("A)")[1].split("B)")[0]?.trim();
            let b2 = b.split("B)")[1]?.split("C)")[0]?.trim();
            let c = b.split("C)")[1]?.split("D)")[0]?.trim();
            let d = b.split("D)")[1]?.split("RESPUESTA:")[0]?.trim();
            let r = b.split("RESPUESTA:")[1]?.trim().charAt(0);

            questions.push({q,a,b:b2,c,d,r});
        }
    });

    if(questions.length === 0){
        alert("⚠️ No se detectaron preguntas");
        return;
    }

    setup.classList.add("hidden");
    exam.classList.remove("hidden");

    startTimers();
    show();
}

function startTimers(){

    clearInterval(totalInterval);

    totalInterval = setInterval(()=>{

        totalTime--;
        timeUsed++;

        let min = Math.floor(totalTime/60);
        let sec = totalTime%60;

        document.getElementById("totalTimeFixed").innerText =
        `Tiempo total: ${min}:${sec}`;

        let percent = (totalTime / totalInitial) * 100;
        document.getElementById("timeBar").style.width = percent + "%";

        if(totalTime <= 0){
            finish();
        }

    },1000);
}

function show(){

    clearInterval(perInterval);

    let q = questions[i];

    info.innerText = `Pregunta ${i+1} de ${questions.length}`;
    question.innerText = q.q;

    selected = "";

    let html = "";

    ["A","B","C","D"].forEach(op=>{
        html += `<div class="option" onclick="select('${op}',this)">
        ${op}) ${q[op.toLowerCase()]}
        </div>`;
    });

    options.innerHTML = html;

    let t = perTime;

    timer.innerText = `Tiempo pregunta: ${t}s`;

    perInterval = setInterval(()=>{

        t--;
        timer.innerText = `Tiempo pregunta: ${t}s`;

        if(t <= 0){
            next();
        }

    },1000);
}

function select(op,el){
    selected = op;
    document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
    el.classList.add("selected");
}

function next(){
    answers[i] = selected || null;

    if(i < questions.length-1){
        i++;
        show();
    } else {
        finish();
    }
}

function finish(){

    clearInterval(totalInterval);
    clearInterval(perInterval);

    exam.classList.add("hidden");
    result.classList.remove("hidden");

    let correct = 0;

    questions.forEach((q,idx)=>{
        if(answers[idx] === q.r) correct++;
    });

    let percent = Math.round((correct/questions.length)*100);
    let status = percent >= 70 ? "🟢 APROBADO" : "🔴 NO APROBADO";

    let min = Math.floor(timeUsed/60);
    let sec = timeUsed%60;

    final.innerHTML =
    `Puntaje: ${percent}%<br>
    ${status}<br>
    Aciertos: ${correct}/${questions.length}<br><br>

    ⏱️ Tiempo usado: ${min} min ${sec} seg<br><br>

    <button onclick="location.reload()">🔁 Reiniciar</button>
    <button onclick="nextTema()">📚 Siguiente tema</button>`;
}

function nextTema(){
    location.reload();
}

</script>

</body>
</html>
