<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Examen Multi-Materia</title>

<style>
body{
    font-family: 'Segoe UI', Arial;
    margin:0;
    background:#eef2f6;
}

header{
    background:#1b2a3a;
    color:white;
    padding:15px;
    text-align:center;
    font-size:18px;
}

.container{
    width:90%;
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    background:#1b2a3a;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

button:hover{ background:#2c3e50; }

.option{
    padding:12px;
    border:1px solid #ccc;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
}

.option:hover{ background:#f0f0f0; }

.selected{
    background:#1b2a3a;
    color:white;
}

.hidden{ display:none; }

#timer{
    float:right;
    font-weight:bold;
}

#question{
    font-size:20px;
    margin:15px 0;
}

#totalTimeFixed{
    position:fixed;
    bottom:40px;
    width:100%;
    text-align:center;
    background:white;
    padding:5px;
    font-weight:bold;
}

#bar{
    position:fixed;
    bottom:25px;
    width:100%;
    height:10px;
    background:#ccc;
}

#barFill{
    height:100%;
    width:100%;
    background:#1b2a3a;
    transition:1s linear;
}
</style>
</head>

<body>

<header>
Examen Multi-Materia <span id="timer"></span>
</header>

<!-- MENÚ -->
<div class="container" id="menu">

<h2>Selecciona materia</h2>

<button onclick="setMateria('algebra')">📘 Álgebra</button>
<button onclick="setMateria('fisica')">🔬 Física</button>
<button onclick="setMateria('biologia')">🧬 Biología</button>
<button onclick="setMateria('quimica')">⚗️ Química</button>
<button onclick="setMateria('ingles')">🇬🇧 Inglés</button>
<button onclick="setMateria('psicologico')">🧠 Psicológico</button>

</div>

<!-- CONFIG -->
<div class="container hidden" id="setup">

<h2 id="materiaTitle"></h2>

<input id="totalInput" type="number" placeholder="Tiempo total (minutos)">
<input id="perInput" type="number" placeholder="Tiempo por pregunta (segundos)">

<button onclick="cargar()">Iniciar examen</button>

</div>

<!-- EXAMEN -->
<div class="container hidden" id="exam">

<div id="info"></div>
<div id="question"></div>
<div id="options"></div>

<button onclick="next()">Siguiente</button>

<!-- 🔥 BOTÓN NUEVO -->
<button onclick="backMenu()" style="background:#555;">
⬅️ Cambiar materia
</button>

</div>

<!-- RESULTADOS -->
<div class="container hidden" id="result">
<h2>Resultados</h2>
<p id="final"></p>
</div>

<div id="bar"><div id="barFill"></div></div>
<div id="totalTimeFixed"></div>

<script>

let materia = "";
let questions = [];
let answers = [];
let i = 0;
let selected = "";

let totalTime;
let perTime;
let totalInitial;
let totalInterval;
let perInterval;
let timeUsed = 0;

// 📦 BANCO
const bancos = {
algebra:`PREGUNTA: ¿2x + 2 = 6, x=? A)1 B)2 C)3 D)4 RESPUESTA: B`,
fisica:`PREGUNTA: ¿Unidad de fuerza? A)Joule B)Newton C)Watt D)Pascal RESPUESTA: B`,
biologia:`PREGUNTA: ¿Organelo energía? A)Núcleo B)Mitocondria C)Ribosoma D)Golgi RESPUESTA: B`,
quimica:`PREGUNTA: H2O es? A)Oxígeno B)Ácido C)Agua D)Gas RESPUESTA: C`,
ingles:`PREGUNTA: Apple significa? A)Pera B)Manzana C)Uva D)Banana RESPUESTA: B`,
psicologico:`PREGUNTA: Memoria es? A)Proceso B)Reflejo C)Instinto D)Hábito RESPUESTA: A`
};

function setMateria(m){
    materia = m;
    menu.classList.add("hidden");
    setup.classList.remove("hidden");
    document.getElementById("materiaTitle").innerText =
    "Materia: " + m.toUpperCase();
}

function cargar(){

    questions = [];
    answers = [];
    i = 0;
    timeUsed = 0;

    let text = bancos[materia];
    let blocks = text.split("PREGUNTA:");

    blocks.forEach(b=>{
        if(b.includes("RESPUESTA:")){
            let q = b.split("A)")[0].trim();
            let a = b.split("A)")[1]?.split("B)")[0];
            let b2 = b.split("B)")[1]?.split("C)")[0];
            let c = b.split("C)")[1]?.split("D)")[0];
            let d = b.split("D)")[1]?.split("RESPUESTA:")[0];
            let r = b.split("RESPUESTA:")[1]?.trim().charAt(0);

            questions.push({q,a,b:b2,c,d,r});
        }
    });

    totalTime = (parseInt(totalInput.value) || 1) * 60;
    perTime = parseInt(perInput.value) || 10;
    totalInitial = totalTime;

    setup.classList.add("hidden");
    exam.classList.remove("hidden");

    start();
    show();
}

function backMenu(){

    clearInterval(totalInterval);
    clearInterval(perInterval);

    questions = [];
    answers = [];
    i = 0;
    selected = "";
    timeUsed = 0;

    exam.classList.add("hidden");
    setup.classList.add("hidden");
    result.classList.add("hidden");

    menu.classList.remove("hidden");
}

function start(){

    totalInterval = setInterval(()=>{

        totalTime--;
        timeUsed++;

        let m = Math.floor(totalTime/60);
        let s = totalTime%60;

        totalTimeFixed.innerText = `Tiempo: ${m}:${s}`;

        let p = (totalTime/totalInitial)*100;
        barFill.style.width = p + "%";

        if(totalTime<=0) finish();

    },1000);
}

function show(){

    clearInterval(perInterval);

    let q = questions[i];

    info.innerText = `Pregunta ${i+1}/${questions.length}`;
    question.innerText = q.q;

    selected = "";

    let html = "";
    ["A","B","C","D"].forEach(o=>{
        html += `<div class="option" onclick="select('${o}',this)">
        ${o}) ${q[o.toLowerCase()]}
        </div>`;
    });

    options.innerHTML = html;

    let t = perTime;
    timer.innerText = t;

    perInterval = setInterval(()=>{
        t--;
        timer.innerText = t;
        if(t<=0) next();
    },1000);
}

function select(o,e){
    selected=o;
    document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
    e.classList.add("selected");
}

function next(){
    answers[i]=selected;
    if(i<questions.length-1){
        i++;
        show();
    }else finish();
}

function finish(){

    clearInterval(totalInterval);
    clearInterval(perInterval);

    exam.classList.add("hidden");
    result.classList.remove("hidden");

    let c=0;
    questions.forEach((q,idx)=>{
        if(answers[idx]===q.r) c++;
    });

    let p=Math.round((c/questions.length)*100);
    let st=p>=70?"🟢 APROBADO":"🔴 NO APROBADO";

    final.innerHTML=
    `Materia: ${materia}<br>
    Puntaje: ${p}%<br>
    ${st}<br>
    Aciertos: ${c}/${questions.length}<br>
    <button onclick="location.reload()">Reiniciar</button>`;
}

</script>

</body>
</html>
